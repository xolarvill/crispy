[project]
name = "crispy"
version = "0.1.0"
description = "crispy — the marketing workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.0",
    "crewai>=1.6.1",
    "fastapi>=0.136.0",
    "firecrawl-py>=4.23.0",
    "imageio-ffmpeg>=0.6.0",
    "jinja2>=3.1.0",
    "openai>=2.32.0",
    "openpyxl>=3.1.5",
    "pillow>=12.2.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.49",
    "tavily-python>=0.7.24",
    "uvicorn[standard]>=0.45.0",
    "httpx>=0.28.1",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"